<!DOCTYPE html>
<html>
<head>
<style>
  .poem {
    counter-reset: line-count;
    font-family: serif;
    margin: 20px;
  }
  .line {
    counter-increment: line-count;
    position: relative;
    padding-left: 50px;
    line-height: 1.5;
  }
  /* The sibling-based CSS only approach */
  .line:nth-of-type(5n)::after {
    content: counter(line-count);
    position: absolute;
    left: 0;
    color: #888;
    font-size: 0.8em;
  }
  .stanza-break {
    height: 1.5em;
  }
</style>
</head>
<body>
  <h3>CSS Only (Siblings)</h3>
  <div class="poem">
    <div class="line">Line 1</div>
    <div class="line">Line 2</div>
    <div class="line">Line 3</div>
    <div class="line">Line 4</div>
    <div class="line">Line 5</div>
    <div class="line">Line 6</div>
    <div class="line">Line 7</div>
    <div class="stanza-break"></div>
    <div class="line">Line 8</div>
    <div class="line">Line 9</div>
    <div class="line">Line 10</div>
    <div class="line">Line 11</div>
  </div>

  <h3>JavaScript (Works with nested stanzas)</h3>
  <div class="poem" id="poem-js">
    <div class="stanza">
      <div class="line-js">Line 1</div>
      <div class="line-js">Line 2</div>
      <div class="line-js">Line 3</div>
      <div class="line-js">Line 4</div>
      <div class="line-js">Line 5</div>
      <div class="line-js">Line 6</div>
      <div class="line-js">Line 7</div>
    </div>
    <br>
    <div class="stanza">
      <div class="line-js">Line 8</div>
      <div class="line-js">Line 9</div>
      <div class="line-js">Line 10</div>
      <div class="line-js">Line 11</div>
    </div>
  </div>

  <script>
    const lines = document.querySelectorAll('.line-js');
    lines.forEach((line, index) => {
      const num = index + 1;
      if (num % 5 === 0) {
        const span = document.createElement('span');
        span.textContent = num;
        span.style.position = 'absolute';
        span.style.left = '0';
        span.style.color = 'blue';
        line.style.position = 'relative';
        line.style.paddingLeft = '50px';
        line.appendChild(span);
      }
    });
  </script>
</body>
</html>
